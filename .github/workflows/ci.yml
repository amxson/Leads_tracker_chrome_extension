name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  project-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test
      - run: npm run build
